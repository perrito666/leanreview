name: Release

# Runs when a pull request is merged into main (i.e. a push to main),
# auto-tags the next version, cross-compiles binaries, and publishes a
# GitHub Release. Include "[skip release]" in the merge commit to skip.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full tag history, to compute the next version

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Compute next version
        id: version
        run: |
          set -euo pipefail
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          [ -z "$latest" ] && latest="v0.0.0"
          IFS=. read -r major minor patch <<< "${latest#v}"
          msg=$(git log -1 --pretty=%B)
          if echo "$msg" | grep -qiE '#major'; then
            major=$((major + 1)); minor=0; patch=0
          elif echo "$msg" | grep -qiE '#minor'; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi
          next="v${major}.${minor}.${patch}"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "Next version: $next (previous: $latest)"

      - name: Build release binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for p in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${p%/*}; arch=${p#*/}
            bin="leanreview"; [ "$os" = "windows" ] && bin="leanreview.exe"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "$bin" ./cmd/leanreview
            name="leanreview_${VERSION}_${os}_${arch}"
            if [ "$os" = "windows" ]; then
              zip -q "dist/${name}.zip" "$bin" README.md LICENSE
            else
              tar czf "dist/${name}.tar.gz" "$bin" README.md LICENSE
            fi
            rm -f "$bin"
          done
          (cd dist && sha256sum * > checksums.txt)
          ls -la dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "Tag ${VERSION} already exists; nothing to release."
            exit 0
          fi
          gh release create "${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "${VERSION}" \
            --generate-notes \
            dist/*
